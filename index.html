<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #70c5ce;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            overflow: hidden;
            background-color: #70c5ce;
            border: 2px solid #000;
        }
        
        #bird {
            position: absolute;
            width: 40px;
            height: 30px;
            background-color: #ffeb3b;
            border-radius: 50%;
            left: 50px;
            top: 300px;
        }
        
        .pipe {
            position: absolute;
            width: 60px;
            background-color: #4caf50;
            right: -60px;
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        #restart-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="bird"></div>
        <div id="score">0</div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        // Game variables
        const bird = document.getElementById('bird');
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        let birdPosition = 300;
        let birdVelocity = 0;
        let gravity = 0.5;
        let jumpForce = -10;
        let gameRunning = true;
        let score = 0;
        let pipes = [];
        let pipeGap = 150;
        let pipeFrequency = 1500; // milliseconds
        let lastPipeTime = 0;
        
        // Game loop
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            
            updateBird();
            updatePipes();
            checkCollisions();
            spawnPipes(timestamp);
            
            requestAnimationFrame(gameLoop);
        }
        
        // Update bird position
        function updateBird() {
            birdVelocity += gravity;
            birdPosition += birdVelocity;
            bird.style.top = birdPosition + 'px';
            
            // Rotate bird based on velocity
            bird.style.transform = `rotate(${birdVelocity * 3}deg)`;
            
            // Prevent bird from going above the top
            if (birdPosition < 0) {
                birdPosition = 0;
                birdVelocity = 0;
            }
            
            // Game over if bird hits the bottom
            if (birdPosition > gameContainer.clientHeight - 30) {
                endGame();
            }
        }
        
        // Spawn pipes
        function spawnPipes(timestamp) {
            if (timestamp - lastPipeTime > pipeFrequency) {
                createPipe();
                lastPipeTime = timestamp;
            }
        }
        
        // Create a new pipe
        function createPipe() {
            const pipeTopHeight = Math.random() * (gameContainer.clientHeight - pipeGap - 100) + 50;
            const pipeBottomHeight = gameContainer.clientHeight - pipeTopHeight - pipeGap;
            
            const pipeTop = document.createElement('div');
            pipeTop.className = 'pipe';
            pipeTop.style.height = pipeTopHeight + 'px';
            pipeTop.style.top = '0';
            
            const pipeBottom = document.createElement('div');
            pipeBottom.className = 'pipe';
            pipeBottom.style.height = pipeBottomHeight + 'px';
            pipeBottom.style.bottom = '0';
            
            gameContainer.appendChild(pipeTop);
            gameContainer.appendChild(pipeBottom);
            
            pipes.push({
                element: pipeTop,
                x: gameContainer.clientWidth,
                height: pipeTopHeight,
                top: true
            });
            
            pipes.push({
                element: pipeBottom,
                x: gameContainer.clientWidth,
                height: pipeBottomHeight,
                top: false
            });
        }
        
        // Update pipes position
        function updatePipes() {
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= 2;
                pipe.element.style.right = (gameContainer.clientWidth - pipe.x - 60) + 'px';
                
                // Remove pipes that are off screen
                if (pipe.x < -60) {
                    gameContainer.removeChild(pipe.element);
                    pipes.splice(i, 1);
                    
                    // Increase score when pipe passes
                    if (pipe.top) {
                        score++;
                        scoreElement.textContent = score;
                    }
                }
            }
        }
        
        // Check for collisions
        function checkCollisions() {
            const birdRect = {
                x: 50,
                y: birdPosition,
                width: 40,
                height: 30
            };
            
            for (const pipe of pipes) {
                const pipeRect = {
                    x: pipe.x,
                    y: pipe.top ? 0 : gameContainer.clientHeight - pipe.height,
                    width: 60,
                    height: pipe.height
                };
                
                if (
                    birdRect.x < pipeRect.x + pipeRect.width &&
                    birdRect.x + birdRect.width > pipeRect.x &&
                    birdRect.y < pipeRect.y + pipeRect.height &&
                    birdRect.y + birdRect.height > pipeRect.y
                ) {
                    endGame();
                    break;
                }
            }
        }
        
        // End the game
        function endGame() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }
        
        // Restart the game
        function restartGame() {
            // Clear all pipes
            for (const pipe of pipes) {
                gameContainer.removeChild(pipe.element);
            }
            pipes = [];
            
            // Reset bird
            birdPosition = 300;
            birdVelocity = 0;
            bird.style.top = birdPosition + 'px';
            bird.style.transform = 'rotate(0deg)';
            
            // Reset score
            score = 0;
            scoreElement.textContent = score;
            
            // Hide game over screen
            gameOverElement.style.display = 'none';
            
            // Start game
            gameRunning = true;
            lastPipeTime = 0;
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) {
                birdVelocity = jumpForce;
            }
        });
        
        gameContainer.addEventListener('click', () => {
            if (gameRunning) {
                birdVelocity = jumpForce;
            }
        });
        
        restartBtn.addEventListener('click', restartGame);
        
        // Start the game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
